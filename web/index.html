<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Docs Reviewer</title>
  
  <!-- Local Vendor CSS (Zero external network dependencies, 100% offline & fast) -->
  <link rel="stylesheet" href="lib/github-markdown.min.css">
  <link rel="stylesheet" href="lib/prism-tomorrow.min.css">
  
  <!-- Custom Application CSS -->
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Bar -->
    <header class="app-header">
      <div class="header-left">
        <button id="toggle-sidebar-btn" class="icon-btn" title="Toggle Sidebar (Ctrl+B)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="brand">
          <span class="brand-badge">REVIEW</span>
          <span class="brand-title">Learning Docs</span>
        </div>
        <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
      </div>

      <div class="header-right">
        <div class="quick-nav-wrapper">
          <span class="search-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="text" id="global-search" placeholder="Tìm kiếm nhanh tài liệu... (/)">
          <kbd class="shortcut-hint">/</kbd>
        </div>

        <button id="theme-toggle-btn" class="icon-btn" title="Chuyển chế độ Sáng / Tối">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <button id="toggle-toc-btn" class="icon-btn" title="Toggle Mục lục (TOC)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <div class="app-body">
      <!-- Left Sidebar: File Tree Navigation -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="category-tabs" id="category-tabs">
            <button class="tab-btn active" data-cat="all">Tất cả</button>
            <button class="tab-btn" data-cat="release">Release</button>
            <button class="tab-btn" data-cat="temporary">Temporary</button>
            <button class="tab-btn" data-cat="interesting">Interesting</button>
          </div>
          <div class="sidebar-stats">
            <span id="doc-counter">Đang tải tài liệu...</span>
          </div>
        </div>

        <div class="tree-container" id="tree-container">
          <!-- Tree / List dynamically rendered here -->
        </div>
      </aside>

      <!-- Center Main Content -->
      <main class="content-area" id="content-area">
        <div class="content-wrapper">
          <div class="doc-header" id="doc-header">
            <div class="doc-meta">
              <span class="category-pill" id="doc-category">DOCUMENT</span>
              <span class="doc-path-display" id="doc-path-display"></span>
            </div>
            <h1 class="doc-title" id="doc-title">Chào mừng bạn đến với Kho Tài Liệu</h1>
          </div>

          <div class="loading-state" id="loading-state" style="display: none;">
            <div class="spinner"></div>
            <span>Đang tải nội dung tài liệu...</span>
          </div>

          <div class="error-state" id="error-state" style="display: none;">
            <div class="error-icon">⚠️</div>
            <h3 id="error-title">Không thể tải tài liệu</h3>
            <p id="error-message"></p>
          </div>

          <!-- Markdown Body Container -->
          <article class="markdown-body" id="markdown-container">
            <!-- Rendered HTML injected here -->
          </article>
        </div>

        <button id="back-to-top" class="back-to-top-btn" title="Lên đầu trang">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="18 15 12 9 6 15"></polyline>
          </svg>
        </button>
      </main>

      <!-- Right Table of Contents (TOC) -->
      <aside class="toc-sidebar" id="toc-sidebar">
        <div class="toc-header">
          <span class="toc-title">MỤC LỤC BÀI VIẾT</span>
        </div>
        <nav class="toc-nav" id="toc-nav">
          <p class="toc-empty">Chưa có mục lục</p>
        </nav>
      </aside>
    </div>
  </div>

  <!-- Image Lightbox Modal -->
  <div id="image-modal" class="modal-overlay" style="display: none;">
    <button class="modal-close" id="modal-close">&times;</button>
    <img id="modal-img" src="" alt="Enlarged diagram">
    <div class="modal-caption" id="modal-caption"></div>
  </div>

  <!-- Local Core Libraries (Zero build tools, 100% offline & fast) -->
  <script src="lib/marked.min.js"></script>
  <script src="lib/prism.min.js"></script>
  <!-- Prism Language Grammars -->
  <script src="lib/prism-components/prism-java.min.js"></script>
  <script src="lib/prism-components/prism-python.min.js"></script>
  <script src="lib/prism-components/prism-bash.min.js"></script>
  <script src="lib/prism-components/prism-c.min.js"></script>
  <script src="lib/prism-components/prism-cpp.min.js"></script>
  <script src="lib/prism-components/prism-json.min.js"></script>
  <script src="lib/prism-components/prism-sql.min.js"></script>
  <script src="lib/prism-components/prism-yaml.min.js"></script>
  <script src="lib/prism-components/prism-docker.min.js"></script>
  <script src="lib/prism-components/prism-go.min.js"></script>
  <script src="lib/prism-components/prism-rust.min.js"></script>
  <script src="lib/prism-components/prism-typescript.min.js"></script>
  <script src="lib/mermaid.min.js"></script>

  <!-- Pre-built Manifest Data -->
  <script src="manifest.js"></script>

  <!-- Main App Script -->
  <script src="index.js"></script>
</body>
</html>
